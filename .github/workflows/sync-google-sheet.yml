name: Sync Google Sheet Data
# Reads the configured public Google Sheet and publishes a static site snapshot.

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/google_sheet_latest.csv"
      - "data/opportunities.json"
      - "data/last_sync.json"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: scholarnews-google-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync Google Sheet
        run: python3 scripts/sync_google_sheet.py

      - name: Commit synced data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/google_sheet_latest.csv data/opportunities.json data/last_sync.json

          if git diff --cached --quiet; then
            echo "No Google Sheet data changes."
            exit 0
          fi

          git commit -m "chore: sync Google Sheet data"

          # The website repo can receive commits while this job is running.
          # Rebase our generated data commit onto the newest main before pushing.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; aborting rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Google Sheet sync pushed successfully."
              exit 0
            fi

            echo "Push rejected because main moved. Fetching again and retrying..."
            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1
