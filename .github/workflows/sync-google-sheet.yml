name: Sync Google Sheet Data

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/google_sheet_latest.csv"
      - "data/opportunities.json"
      - "data/last_sync.json"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: scholarnews-google-sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Sync Google Sheet
        run: python3 scripts/sync_google_sheet.py

      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/google_sheet_latest.csv data/opportunities.json data/last_sync.json
          if git diff --cached --quiet; then
            echo "No Google Sheet data changes."
            exit 0
          fi
          git commit -m "chore: sync Google Sheet data"
          git push
