name: Sync Google Sheet Data
# Reads the configured public Google Sheet, publishes a static data snapshot,
# and deploys that same snapshot to GitHub Pages in the same workflow.
#
# This is intentional: a commit made by GITHUB_TOKEN does not trigger another
# GitHub Actions workflow, so Pages deployment must happen here.

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/google_sheet_latest.csv"
      - "data/opportunities.json"
      - "data/last_sync.json"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scholarnews-site-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync Google Sheet
        run: python3 scripts/sync_google_sheet.py

      - name: Commit synced data
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/google_sheet_latest.csv data/opportunities.json data/last_sync.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Google Sheet data changes."
            exit 0
          fi

          git commit -m "chore: sync Google Sheet data"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push synced data safely
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # Another job or a manual edit can move main while this job runs.
          # Rebase onto the newest main immediately before pushing.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected; aborting rebase."
              git rebase --abort
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Google Sheet data pushed successfully."
              exit 0
            fi

            echo "Push rejected because main moved. Retrying..."
            sleep 2
          done

          echo "Failed to push after 5 attempts."
          exit 1

      # IMPORTANT:
      # Deploy in THIS workflow so the GITHUB_TOKEN commit does not need to
      # trigger a second workflow. The artifact is the exact working tree
      # produced by the successful Google Sheet synchronization.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
